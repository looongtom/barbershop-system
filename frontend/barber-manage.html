    <div class="container mt-4">
        <h1 class="text-center">Barber Data Table</h1>
        <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#createBarberModal">Create New Barber</button>

        <div id="barberData">
            <!-- Data will be inserted here -->
        </div>
    </div>

    <!-- Create Barber Modal -->
    <div class="modal fade" id="createBarberModal" tabindex="-1" aria-labelledby="createBarberModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createBarberModalLabel">Create New Barber</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="createBarberForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" required>
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" name="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label for="dob" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="dob" name="dob">
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="text" class="form-control" id="password" name="password">
                        </div>
                        <input type="text" class="form-control" id="role" name="role" value=2 hidden>
                        <button type="submit" class="btn btn-success">Create Barber</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
