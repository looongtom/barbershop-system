syntax = "proto3";

option go_package = "/pb";

import "google/protobuf/wrappers.proto";

message Account {
    int32 id = 1;
    string username = 2;
    string email=3;
    int32 role=4;
    string phonenumber=5;
    string fullname = 6;
    string about = 7;
    string avatar = 8;
    int64 created_at = 9;
    int64 updated_at = 10;
}

message Role {
    int32 id = 1;
    string name = 2;
}

message CheckExistedBarberRequest {
    int32 id =1;
}

message VerifyTokenRequest{
    string token = 1;
}

//return string message
service UserService {
    rpc CheckExistedBarber(CheckExistedBarberRequest) returns (google.protobuf.StringValue) {};
    rpc VerifyToken(VerifyTokenRequest) returns (google.protobuf.StringValue) {};
    rpc GetAccountById(CheckExistedBarberRequest) returns (Account) {};
}