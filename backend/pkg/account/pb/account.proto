syntax = "proto3";

option go_package = "/pb";

import "google/protobuf/wrappers.proto";

message Account {
    int32 id = 1;
    string username = 2;
    string email=3;
    string password=4;
    int32 role=5;
    string phonenumber=6;
    string fullname = 7;
    string about = 8;
    string avatar = 9;
    int64 created_at = 10;
    int64 updated_at = 11;
}

message Role {
    int32 id = 1;
    string name = 2;
}

message CheckExistedBarberRequest {
    int32 id =1;
}
//return string message
service UserService {
    rpc CheckExistedBarber(CheckExistedBarberRequest) returns (google.protobuf.StringValue) {};
}